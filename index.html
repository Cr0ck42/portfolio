        <script>
            const stickyText = document.getElementById('sticky2');
            const sections = document.querySelectorAll('.scroll-section');
    
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const newText = entry.target.dataset.stickyText;
                        if (stickyText.textContent.trim()=== newText) return

                        stickyText.classList.add('fading');
                        setTimeout(() => {
                           stickyText.textContent = newText;
                           stickyText.classList.remove('fading') 
                        }, 350);
                    }
                });
            }, {
                threshold: 0.4
            });
    
            sections.forEach(section => observer.observe(section));
        </script>
